<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Try OCR | Result</title>

    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tw-elements/css/tw-elements.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                inter: ['Inter Tight', 'sans-serif'],
              },
            },
          },
        }
    </script>
</head>
<body class="bg-gray-800 w-full min-h-screen py-16 font-inter">

    <div class="max-w-2xl mx-auto">
        <div class="p-6 bg-gray-700 rounded-lg shadow flex flex-col">
            <a th:href="@{/}" class="flex items-center p-2.5 mb-5 self-center">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 33 33" width="33" height="33">
                    <circle cx="16.5" cy="16.5" r="15" fill="#3B82F6" />

                    <rect x="10" y="10" width="13" height="16.5" rx="1.65" ry="1.65" fill="#FFFFFF" />
                    <rect x="11.5" y="11.5" width="10" height="3.3" rx="0.8" ry="0.8" fill="#E5E7EB" />
                    <rect x="11.5" y="16.5" width="10" height="1.65" rx="0.8" ry="0.8" fill="#E5E7EB" />
                    <rect x="11.5" y="20" width="10" height="1.65" rx="0.8" ry="0.8" fill="#E5E7EB" />

                    <circle cx="16.5" cy="25" r="1" fill="#3B82F6" />
                    <path d="M 15.5 26 Q 16.5 26.5 17.5 26" stroke="#3B82F6" stroke-width="0.7" fill="none" />
                    <text x="16.5" y="30" font-size="3.3" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif">OCR</text>
                </svg>
                <span class="ms-2 self-center text-xl font-bold whitespace-nowrap text-white">API OCR Tool</span>
            </a>
            <h4 class="text-xl font-bold mb-3 text-white">Hasil Ekstraksi</h4>
            <h6 class="text-lg font-semibold mb-3 text-gray-200">Original Teks</h6>
            <div class="rounded p-4 bg-gray-600">
                <p th:text="${ocrResult.getOriginalExtractedText()}" class="text-gray-100"></p>
            </div>
            <hr class="h-px my-8 bg-gray-600 border-0">
            <h6 class="text-lg font-semibold mb-3 text-gray-200">Informasi yang dapat diambil dari teks</h6>
            <ol class="space-y-1 list-decimal list-inside">
                <li th:each="et : ${ocrResult.getExtractedTexts()}" class="text-gray-100">
                    <span th:text="${et.getTextKey()}"></span>
                    <span th:text="${et.getTextValue()}"></span>
                </li>
            </ol>
            <hr class="h-px my-8 bg-gray-600 border-0">
            <h6 class="text-lg font-semibold mb-3 text-gray-200">Waktu Ekstraksi <span th:text="${ocrResult.getDuration()}+s"></span></h6>

            <span class="block text-sm text-gray-400 self-center mt-20">© 2024 - 2025 <a href="https://github.com/marijmokoginta" class="hover:underline">Marij Mokoginta™</a>. All Rights Reserved.</span>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
</body>
</html>
