<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>OCR Testing Result</title>

    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tw-elements/css/tw-elements.min.css" />
    <script src="https://cdn.tailwindcss.com/3.3.0"></script>
</head>
<body class="bg-gray-200 w-full min-h-screen py-16">

    <div class="container mx-auto">
        <div class="p-6 bg-white border border-gray-200 rounded-lg shadow flex flex-col">
            <h4 class="text-xl font-extrabold mb-3">Hasil Ekstraksi</h4>
            <h6 class="text-lg font-bold mb-3">Original Teks</h6>
            <p th:text="${ocrResult.getOriginalExtractedText()}"></p>
            <hr class="h-px my-8 bg-gray-200 border-0">
            <h6 class="text-lg font-bold mb-3">Informasi yang dapat diambil dari teks</h6>
            <ol class="space-y-1 list-decimal list-inside">
                <li th:each="et : ${ocrResult.getExtractedTexts()}">
                    <span th:text="${et.getTextKey()}"></span>
                    <span th:text="${et.getTextValue()}"></span>
                </li>
            </ol>
            <hr class="h-px my-8 bg-gray-200 border-0">
            <h6 class="text-lg font-bold mb-3">Waktu Ekstraksi <span th:text="${ocrResult.getDuration()}+s"></span></h6>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
</body>
</html>
