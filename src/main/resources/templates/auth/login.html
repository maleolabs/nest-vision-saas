<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" class="h-full bg-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocr Tool | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tw-elements/css/tw-elements.min.css" />
    <script src="https://cdn.tailwindcss.com/3.3.0"></script>
</head>
<body class="h-full">
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
        <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">Masuk ke akun anda</h2>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">

        <div th:if="${error}" th:text="${error}" class="p-4 my-4 text-sm text-red-800 rounded-lg bg-red-50" role="alert"></div>

        <form class="space-y-6" th:action="@{/auth/login}" th:object="${loginRequest}" method="POST">
            <div>
                <label for="username" class="block text-sm/6 font-medium text-gray-900">Masukkan Username atau Email</label>
                <div class="mt-2">
                    <input th:field="*{username}" type="text" name="username" id="username" autocomplete="username" required
                           placeholder="johndoe"
                           class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm/6 font-medium text-gray-900">Masukkan Password</label>
                <div class="mt-2">
                    <input type="password" th:field="*{password}" name="password" id="password" autocomplete="current-password" required
                           class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                </div>
            </div>

            <div>
                <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold
                text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2
                focus-visible:outline-indigo-600">Masuk</button>
            </div>
        </form>

        <p class="mt-10 text-center text-sm/6 text-gray-500">
            Belum mempunyai akun?
            <a href="/auth/register" class="font-semibold text-indigo-600 hover:text-indigo-500">Daftar</a>
        </p>
    </div>
</div>
</body>
</html>
