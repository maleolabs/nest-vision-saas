<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" class="h-full bg-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocr Tool | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tw-elements/css/tw-elements.min.css" />
    <script src="https://cdn.tailwindcss.com/3.3.0"></script>
</head>
<body class="h-full">
    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm">
            <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">Buat akun baru</h2>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">

            <div th:if="${error}" th:text="${error}" class="p-4 my-4 text-sm text-red-800 rounded-lg bg-red-50" role="alert"></div>

            <form class="space-y-6" th:action="@{/auth/register}" th:object="${registerRequest}" method="POST">
                <div>
                    <label for="username" class="block text-sm/6 font-medium text-gray-900">Masukkan Username</label>
                    <div class="mt-2">
                        <input th:field="*{username}"
                               type="text" name="username" id="username" autocomplete="username" required
                               placeholder="johndoe"
                               th:classappend="${#fields.hasErrors('username') ? 'bg-red-50 outline-red-300 text-red-900 placeholder-red-700 text-sm rounded-lg focus:ring-red-500 focus:outline-red-600' : 'bg-white text-gray-900 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600'}"
                               class="block w-full rounded-md px-3 py-1.5 text-base outline outline-1 -outline-offset-1 focus:outline focus:outline-2 focus:-outline-offset-2 sm:text-sm/6">
                        <div th:if="${#fields.hasErrors('username')}">
                            <span th:each="err : ${#fields.errors('username')}" th:text="${err}" class="text-sm text-red-800 dark:text-red-400 font-medium" role="alert"></span>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm/6 font-medium text-gray-900">Masukkan alamat Email</label>
                    <div class="mt-2">
                        <input type="email" th:field="*{email}"
                               name="email" id="email" autocomplete="email" required
                               placeholder="johndoe@email.com"
                               th:classappend="${#fields.hasErrors('email') ? 'bg-red-50 outline-red-300 text-red-900 placeholder-red-700 text-sm rounded-lg focus:ring-red-500 focus:outline-red-600' : 'bg-white text-gray-900 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600'}"
                               class="block w-full rounded-md px-3 py-1.5 text-base outline outline-1 -outline-offset-1 focus:outline focus:outline-2 focus:-outline-offset-2 sm:text-sm/6">
                        <div th:if="${#fields.hasErrors('email')}">
                            <span th:each="err : ${#fields.errors('email')}" th:text="${err}" class="text-sm text-red-800 dark:text-red-400 font-medium" role="alert"></span>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm/6 font-medium text-gray-900">Masukkan Password</label>
                    <div class="mt-2">
                        <input type="password" th:field="*{password}"
                               name="password" id="password" autocomplete="current-password" required
                               th:classappend="${#fields.hasErrors('password') ? 'bg-red-50 outline-red-300 text-red-900 placeholder-red-700 text-sm rounded-lg focus:ring-red-500 focus:outline-red-600' : 'bg-white text-gray-900 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600'}"
                               class="block w-full rounded-md px-3 py-1.5 text-base outline outline-1 -outline-offset-1 focus:outline focus:outline-2 focus:-outline-offset-2 sm:text-sm/6">
                        <div th:if="${#fields.hasErrors('password')}">
                            <span th:each="err : ${#fields.errors('password')}" th:text="${err}" class="text-sm text-red-800 dark:text-red-400 font-medium" role="alert"></span>
                        </div>
                    </div>
                </div>

                <div>
                    <button type="submit"
                            class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2
                            focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Daftar</button>
                </div>
            </form>

            <p class="mt-10 text-center text-sm/6 text-gray-500">
                Sudah mempunyai akun?
                <a href="/auth/login" class="font-semibold text-indigo-600 hover:text-indigo-500">Masuk</a>
            </p>
        </div>
    </div>
</body>
</html>
