spring.application.name=perizinan-ocr-tool

server.address=0.0.0.0

spring.config.additional-location=/lib/x86_64-linux-gnu

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=ubuntudev
spring.datasource.password=ubuntu@m2code
spring.datasource.url=jdbc:mysql://localhost:3306/perizinan_ocr_tool

spring.jpa.hibernate.ddl-auto=update

app.api-key.length=32
app.api-key.lifetime=180

physical-device.core-pool=5
physical-device.max-pool=10
physical-device.queue-capacity=20

perizinan-dpmptsp.api.base-url=http://172.21.0.13:8000/api
perizinan-dpmptsp.api.entri-data-path=/data-entri/{id}
perizinan-dpmptsp.api.current-user-path=/auth/me
perizinan-dpmptsp.api.validating-client-token-path=/verify-client-token/{token}

file.upload-method=local
