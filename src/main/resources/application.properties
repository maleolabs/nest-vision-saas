spring.profiles.active=dev

spring.application.name=OCR-Tool

server.servlet.session.timeout=${SERVER_SERVLET_SESSION_TIMEOUT:1500m}

spring.config.additional-location=${SPRING_CONFIG_ADDITIONAL_LOCATION:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ocr}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ocr}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/ocr_tool?createDatabaseIfNotExist=true}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL-AUTO:update}

tesseract.datapath=${TESSERACT_DATAPATH:/usr/share/tesseract/tessdata}

ocr.python.path=${OCR_PYTHON_PATH:python3}
ocr.script.path=${OCR_SCRIPT_PATH:opt/app/ocr/tesseract_ocr.py}

app.api-key.length=${APP_API-KEY_LENGTH:32}
app.api-key.lifetime=${APP_API-KEY_LIFETIME:180}

physical-device.core-pool=${PHYSICAL-DEVICE_CORE-POOL:3}
physical-device.max-pool=${PHYSICAL-DEVICE_MAX-POOL:5}
physical-device.queue-capacity=${PHYSICAL-DEVICE_QUEUE-CAPACITY:50}

file.upload-method=${FILE_UPLOAD-METHOD:local}
file.upload-dir=${FILE_UPLOAD-DIR:uploads/ocr-request}
file.external-api-url=${FILE_EXTERNAL-API-URL:}
file.external-api-key=${FILE_EXTERNAL-API-KEY:}

keystore.password=${KEYSTORE_PASSWORD:changeit}
keystore.alias=${KEYSTORE_ALIAS:ocr}

account.personal.daily-limit=${ACCOUNT_PERSONAL_DAILY-LIMIT:20}
account.organization.daily-limit=${ACCOUNT_ORGANIZATION_DAILY-LIMIT:50}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:dev@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:dev}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

perizinan-dpmptsp.api.base-url=${PERIZINAN_DPMTPST_API_BASE_URL:http://localhost:8080}