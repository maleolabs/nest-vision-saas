spring.application.name=ocr-tool

server.address=0.0.0.0
server.servlet.session.timeout=1500m

spring.config.additional-location=/lib/x86_64-linux-gnu

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=ubuntudev
spring.datasource.password=ubuntu@m2code
spring.datasource.url=jdbc:mysql://localhost:3306/perizinan_ocr_tool

spring.jpa.hibernate.ddl-auto=update

tesseract.datapath=/usr/share/tesseract-ocr/5/tessdata/

app.api-key.length=32
app.api-key.lifetime=180

physical-device.core-pool=3
physical-device.max-pool=5
physical-device.queue-capacity=50

file.upload-method=local
file.upload-dir=uploads/ocr-request
file.external-api-url=
file.external-api-key=

keystore.password=secret
keystore.alias=m2code

account.personal.daily-limit=20
account.organization.daily-limit=50

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
