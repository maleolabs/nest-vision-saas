spring.application.name=OCR-Tool

server.servlet.session.timeout=${SERVER_SERVLET_SESSION_TIMEOUT}

spring.config.additional-location=${SPRING_CONFIG_ADDITIONAL_LOCATION}

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER-CLASS-NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.url=${SPRING_DATASOURCE_URL}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL-AUTO}

tesseract.datapath=${TESSERACT_DATAPATH}

app.api-key.length=${APP_API-KEY_LENGTH}
app.api-key.lifetime=${APP_API-KEY_LIFETIME}

physical-device.core-pool=${PHYSICAL-DEVICE_CORE-POOL}
physical-device.max-pool=${PHYSICAL-DEVICE_MAX-POOL}
physical-device.queue-capacity=${PHYSICAL-DEVICE_QUEUE-CAPACITY}

file.upload-method=${FILE_UPLOAD-METHOD}
file.upload-dir=${FILE_UPLOAD-DIR}
file.external-api-url=${FILE_EXTERNAL-API-URL}
file.external-api-key=${FILE_EXTERNAL-API-KEY}

keystore.password=${KEYSTORE_PASSWORD}
keystore.alias=${KEYSTORE_ALIAS}

account.personal.daily-limit=${ACCOUNT_PERSONAL_DAILY-LIMIT}
account.organization.daily-limit=${ACCOUNT_ORGANIZATION_DAILY-LIMIT}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}