# Profile test untuk integration smoke test (OcrToolApplicationTests).
#
# Migrasi TETAP dijalankan (tidak dimatikan) supaya CI benar-benar menguji
# V1__baseline_schema.sql + delta V2..V5 pada database kosong, dan
# `ddl-auto=validate` memastikan hasil migrasi cocok dengan mapping entity.
# Butuh database MySQL kosong (CI service / MySQL lokal); jangan arahkan ke
# database berisi data produksi karena context test memakai user aplikasi.
spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/ocr_tool_test?createDatabaseIfNotExist=true}
spring.datasource.username=${TEST_DATASOURCE_USERNAME:ocr}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD:ocr}
spring.jpa.hibernate.ddl-auto=validate
# MariaDB melapor sebagai "MySQL 11.8.8-MariaDB" lewat driver MySQL Connector/J;
# Hibernate 6 gagal mengambil versinya → tetapkan dialek eksplisit.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# API key generator menolak start tanpa pepper minimal 32 karakter.
# Nilai ini KHUSUS test, bukan secret production.
app.api-key.pepper=test-only-pepper-0123456789abcdef0123456789
# KeyStoreUtil butuh keystore.password tanpa default; test memakai
# in-memory JCEKS sementara (path writeable di target/).
keystore.path=${java.io.tmpdir}/ocr-tool-test-keystore.jks
keystore.password=test-only-keystore-password
keystore.alias=ocr
# ApiKeyEncryption butuh secret AES-256 (base64, decode ke 32 byte).
# Nilai ini KHUSUS test, bukan secret production.
app.api-key.encryption-secret=8d9Xi5zfiQyAlsTV+Fx+0KxDjCcuv2a0mgs1v4Q24ts
