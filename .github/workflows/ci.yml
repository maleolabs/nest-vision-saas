name: CI

on:
  push:
    branches: [master, "feat/**", "security/**"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ocr_tool_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check Tailwind CSS is up to date
        run: scripts/build-css.sh --check
      - name: Build and test
        run: ./mvnw -B verify
        env:
          TEST_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/ocr_tool_test?createDatabaseIfNotExist=true
          TEST_DATASOURCE_USERNAME: root
          TEST_DATASOURCE_PASSWORD: root
