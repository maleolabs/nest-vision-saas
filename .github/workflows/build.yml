name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package
        run: ./mvnw -B clean package -DskipTests
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ocr-tool-jar
          path: target/*.jar
          retention-days: 7
