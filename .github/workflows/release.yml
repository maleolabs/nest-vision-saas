name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package
        run: ./mvnw -B clean package -DskipTests
      - name: Compute SHA256
        run: |
          JAR=$(ls target/*.jar | head -1)
          sha256sum "$JAR" > "$JAR.sha256"
          cat "$JAR.sha256"
          echo "JAR=$JAR" >> "$GITHUB_ENV"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.JAR }}
            ${{ env.JAR }}.sha256
          generate_release_notes: true
